version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    expose:
      - "2181"
    volumes:
      - zookeeper-data:/data

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    expose:
      - "9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/kafka

  kafka-connect:
    image: quay.io/debezium/connect:3.0
    container_name: kafka-connect
    expose:
      - "8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium-configs
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_TOPIC: debezium-offsets
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_TOPIC: debezium-status
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-connect-init:
    image: curlimages/curl
    container_name: kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: on-failure
    environment:
      - DEBEZIUM_DB_USER=${DEBEZIUM_DB_USER}
      - DEBEZIUM_DB_PASSWORD=${DEBEZIUM_DB_PASSWORD}
      - DEBEZIUM_DB_HOST=${DEBEZIUM_DB_HOST}
    entrypoint:
      - sh
      - -c
      - |
        until curl -sf http://kafka-connect:8083/health; do
          sleep 3
        done
        curl -sf -o /dev/null -X PUT http://kafka-connect:8083/connectors/volunteer-mysql-connector/config \
          -H 'Content-Type: application/json' \
          -d "{
            \"connector.class\": \"io.debezium.connector.mysql.MySqlConnector\",
            \"database.hostname\": \"${DEBEZIUM_DB_HOST}\",
            \"database.port\": \"3306\",
            \"database.user\": \"${DEBEZIUM_DB_USER}\",
            \"database.password\": \"${DEBEZIUM_DB_PASSWORD}\",
            \"database.server.id\": \"1\",
            \"topic.prefix\": \"volunteer\",
            \"database.include.list\": \"finda_volunteer\",
            \"schema.history.internal.kafka.bootstrap.servers\": \"kafka:9092\",
            \"schema.history.internal.kafka.topic\": \"schema-changes.volunteer\",
            \"database.connectionTimeZone\": \"Asia/Seoul\"
          }" || exit 1
        curl -sf -o /dev/null -X PUT http://kafka-connect:8083/connectors/notification-mysql-connector/config \
          -H 'Content-Type: application/json' \
          -d "{
            \"connector.class\": \"io.debezium.connector.mysql.MySqlConnector\",
            \"database.hostname\": \"${DEBEZIUM_DB_HOST}\",
            \"database.port\": \"3306\",
            \"database.user\": \"${DEBEZIUM_DB_USER}\",
            \"database.password\": \"${DEBEZIUM_DB_PASSWORD}\",
            \"database.server.id\": \"2\",
            \"topic.prefix\": \"notification\",
            \"database.include.list\": \"finda_notification\",
            \"schema.history.internal.kafka.bootstrap.servers\": \"kafka:9092\",
            \"schema.history.internal.kafka.topic\": \"schema-changes.notification\",
            \"database.connectionTimeZone\": \"Asia/Seoul\"
          }" || exit 1

  finda-gateway:
    build:
      context: .
      dockerfile: finda-gateway/Dockerfile
    container_name: finda-gateway
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - kafka

  finda-auth:
    build:
      context: .
      dockerfile: finda-auth/Dockerfile
    container_name: finda-auth
    expose:
      - "8081"
    restart: always
    depends_on:
      - kafka

  finda-volunteer:
    build:
      context: .
      dockerfile: finda-volunteer/Dockerfile
    container_name: finda-volunteer
    expose:
      - "8082"
    restart: always
    depends_on:
      - kafka

  finda-notification:
    build:
      context: .
      dockerfile: finda-notification/Dockerfile
    container_name: finda-notification
    expose:
      - "8083"
    restart: always
    depends_on:
      - kafka

  finda-batch:
    build:
      context: .
      dockerfile: finda-batch/Dockerfile
    container_name: finda-batch
    expose:
      - "8084"
    restart: always
    depends_on:
      - kafka

volumes:
  zookeeper-data:
  kafka-data:
